<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="comp" viewBox="0 0 14 10" refX="0" refY="5" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1120" height="720" fill="#f8fafc"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">TaskFlow - UML Class Diagram</text>

  <!-- Main -->
  <g transform="translate(30,65)">
    <rect width="170" height="75" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="170" height="28" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Main</text>
    <text x="10" y="52" font-size="11" fill="#1e293b">+ main(String[] args): void</text>
  </g>

  <!-- ConsoleUI -->
  <g transform="translate(30,190)">
    <rect width="190" height="100" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="190" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="95" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ConsoleUI</text>
    <line x1="0" y1="62" x2="190" y2="62" stroke="#cbd5e1"/>
    <text x="10" y="47" font-size="11" fill="#1e293b">- service: TaskService</text>
    <text x="10" y="82" font-size="11" fill="#1e293b">+ start(): void</text>
  </g>

  <!-- TaskService -->
  <g transform="translate(290,150)">
    <rect width="260" height="185" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="28" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="130" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">TaskService</text>
    <text x="10" y="46" font-size="11" fill="#1e293b">- board: TaskBoard</text>
    <text x="10" y="62" font-size="11" fill="#1e293b">- repository: TaskRepository</text>
    <text x="10" y="78" font-size="11" fill="#1e293b">- sortStrategy: TaskSortStrategy</text>
    <line x1="0" y1="88" x2="260" y2="88" stroke="#cbd5e1"/>
    <text x="10" y="106" font-size="11" fill="#1e293b">+ setSortStrategy(TaskSortStrategy): void</text>
    <text x="10" y="122" font-size="11" fill="#1e293b">+ addSimpleTask(String, int): void</text>
    <text x="10" y="138" font-size="11" fill="#1e293b">+ addDeadlineTask(String, int, LocalDate): void</text>
    <text x="10" y="154" font-size="11" fill="#1e293b">+ getSortedTasks(): List&lt;TaskItem&gt;</text>
    <text x="10" y="170" font-size="11" fill="#1e293b">+ save() / load() / markTaskDone() / deleteTask()</text>
  </g>

  <!-- TaskSortStrategy (Interface) -->
  <g transform="translate(650,65)">
    <rect width="240" height="92" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="240" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="120" y="16" text-anchor="middle" font-size="10" font-style="italic" fill="#5b21b6">&lt;&lt;interface&gt;&gt;</text>
    <text x="120" y="33" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">TaskSortStrategy</text>
    <text x="10" y="60" font-size="11" fill="#1e293b">+ getName(): String</text>
    <text x="10" y="78" font-size="11" fill="#1e293b">+ sort(List&lt;TaskItem&gt;): List&lt;TaskItem&gt;</text>
  </g>

  <!-- UrgencySortStrategy -->
  <g transform="translate(610,205)">
    <rect width="195" height="75" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="195" height="28" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="97" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">UrgencySortStrategy</text>
    <text x="10" y="48" font-size="11" fill="#1e293b">+ getName(): String</text>
    <text x="10" y="64" font-size="11" fill="#1e293b">+ sort(List&lt;TaskItem&gt;): List</text>
  </g>

  <!-- TitleSortStrategy -->
  <g transform="translate(830,205)">
    <rect width="195" height="75" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="195" height="28" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="97" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">TitleSortStrategy</text>
    <text x="10" y="48" font-size="11" fill="#1e293b">+ getName(): String</text>
    <text x="10" y="64" font-size="11" fill="#1e293b">+ sort(List&lt;TaskItem&gt;): List</text>
  </g>

  <!-- TaskRepository (Interface) -->
  <g transform="translate(30,375)">
    <rect width="215" height="92" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect width="215" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="107" y="16" text-anchor="middle" font-size="10" font-style="italic" fill="#92400e">&lt;&lt;interface&gt;&gt;</text>
    <text x="107" y="33" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">TaskRepository</text>
    <text x="10" y="60" font-size="11" fill="#1e293b">+ save(List&lt;TaskItem&gt;): void</text>
    <text x="10" y="78" font-size="11" fill="#1e293b">+ load(): List&lt;TaskItem&gt;</text>
  </g>

  <!-- FileTaskRepository -->
  <g transform="translate(30,525)">
    <rect width="215" height="95" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect width="215" height="28" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
    <text x="107" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">FileTaskRepository</text>
    <text x="10" y="46" font-size="11" fill="#1e293b">- filePath: Path</text>
    <line x1="0" y1="56" x2="215" y2="56" stroke="#cbd5e1"/>
    <text x="10" y="72" font-size="11" fill="#1e293b">+ save(List&lt;TaskItem&gt;): void</text>
    <text x="10" y="88" font-size="11" fill="#1e293b">+ load(): List&lt;TaskItem&gt;</text>
  </g>

  <!-- TaskBoard -->
  <g transform="translate(310,400)">
    <rect width="220" height="125" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="28" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="110" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">TaskBoard</text>
    <text x="10" y="46" font-size="11" fill="#1e293b">- name: String</text>
    <text x="10" y="62" font-size="11" fill="#1e293b">- tasks: List&lt;TaskItem&gt;</text>
    <line x1="0" y1="72" x2="220" y2="72" stroke="#cbd5e1"/>
    <text x="10" y="88" font-size="11" fill="#1e293b">+ addTask(TaskItem): void</text>
    <text x="10" y="104" font-size="11" fill="#1e293b">+ removeTask(TaskItem): void</text>
    <text x="10" y="120" font-size="11" fill="#1e293b">+ getTasks(): List&lt;TaskItem&gt;</text>
  </g>

  <!-- TaskItem (Abstract) -->
  <g transform="translate(650,350)">
    <rect width="250" height="175" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <rect width="250" height="40" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="125" y="16" text-anchor="middle" font-size="10" font-style="italic" fill="#075985">&lt;&lt;abstract&gt;&gt;</text>
    <text x="125" y="33" text-anchor="middle" font-size="13" font-weight="bold" font-style="italic" fill="#0c4a6e">TaskItem</text>
    <text x="10" y="58" font-size="11" fill="#1e293b">- title: String</text>
    <text x="10" y="74" font-size="11" fill="#1e293b">- priority: int</text>
    <text x="10" y="90" font-size="11" fill="#1e293b">- done: boolean</text>
    <line x1="0" y1="100" x2="250" y2="100" stroke="#cbd5e1"/>
    <text x="10" y="116" font-size="11" font-style="italic" fill="#1e293b">+ getTaskType(): String</text>
    <text x="10" y="132" font-size="11" font-style="italic" fill="#1e293b">+ calculateUrgencyScore(): int</text>
    <text x="10" y="148" font-size="11" font-style="italic" fill="#1e293b">+ toStorageString(): String</text>
    <text x="10" y="164" font-size="11" fill="#1e293b">+ formatDetails(): String</text>
  </g>

  <!-- SimpleTask -->
  <g transform="translate(575,585)">
    <rect width="205" height="95" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <rect width="205" height="28" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="102" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">SimpleTask</text>
    <text x="10" y="48" font-size="11" fill="#1e293b">+ getTaskType(): String</text>
    <text x="10" y="64" font-size="11" fill="#1e293b">+ calculateUrgencyScore(): int</text>
    <text x="10" y="80" font-size="11" fill="#1e293b">+ toStorageString(): String</text>
  </g>

  <!-- DeadlineTask -->
  <g transform="translate(820,575)">
    <rect width="235" height="115" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <rect width="235" height="28" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="117" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">DeadlineTask</text>
    <text x="10" y="46" font-size="11" fill="#1e293b">- dueDate: LocalDate</text>
    <line x1="0" y1="54" x2="235" y2="54" stroke="#cbd5e1"/>
    <text x="10" y="70" font-size="11" fill="#1e293b">+ getTaskType(): String</text>
    <text x="10" y="86" font-size="11" fill="#1e293b">+ calculateUrgencyScore(): int</text>
    <text x="10" y="102" font-size="11" fill="#1e293b">+ formatDetails() / toStorageString()</text>
  </g>

  <!-- InvalidTaskException -->
  <g transform="translate(940,385)">
    <rect width="155" height="72" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="155" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="77" y="16" text-anchor="middle" font-size="10" font-style="italic" fill="#991b1b">&lt;&lt;exception&gt;&gt;</text>
    <text x="77" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">InvalidTaskException</text>
    <text x="10" y="58" font-size="10" fill="#1e293b">extends Exception</text>
  </g>

  <!-- Connectors -->
  <!-- Main -> ConsoleUI -->
  <line x1="115" y1="140" x2="115" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ConsoleUI -> TaskService -->
  <line x1="220" y1="240" x2="290" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="228" y="232" font-size="10" fill="#475569">1</text>
  <text x="275" y="232" font-size="10" fill="#475569">1</text>

  <!-- TaskService -> TaskSortStrategy -->
  <path d="M 550 180 L 600 180 L 600 110 L 650 110" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="172" font-size="10" fill="#475569">1</text>
  <text x="635" y="104" font-size="10" fill="#475569">1</text>

  <!-- UrgencySortStrategy ..|> TaskSortStrategy -->
  <path d="M 705 205 L 705 180 L 745 180 L 745 157" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- TitleSortStrategy ..|> TaskSortStrategy -->
  <path d="M 925 205 L 925 180 L 800 180 L 800 157" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#inherit)"/>

  <!-- TaskService -> TaskRepository -->
  <path d="M 330 335 L 330 355 L 137 355 L 137 375" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="348" font-size="10" fill="#475569">1</text>
  <text x="145" y="370" font-size="10" fill="#475569">1</text>

  <!-- FileTaskRepository ..|> TaskRepository -->
  <line x1="137" y1="525" x2="137" y2="467" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#inherit)"/>

  <!-- TaskService -> TaskBoard -->
  <line x1="420" y1="335" x2="420" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="427" y="352" font-size="10" fill="#475569">1</text>
  <text x="427" y="392" font-size="10" fill="#475569">1</text>

  <!-- TaskBoard *-- TaskItem -->
  <line x1="530" y1="455" x2="650" y2="455" stroke="#334155" stroke-width="1.5" marker-start="url(#comp)" marker-end="url(#arrow)"/>
  <text x="546" y="447" font-size="10" fill="#475569">1</text>
  <text x="622" y="447" font-size="10" fill="#475569">0..*</text>

  <!-- SimpleTask --|> TaskItem -->
  <path d="M 677 585 L 677 555 L 745 555 L 745 525" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#inherit)"/>
  <!-- DeadlineTask --|> TaskItem -->
  <path d="M 935 575 L 935 555 L 810 555 L 810 525" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#inherit)"/>

  <!-- TaskItem ..> InvalidTaskException -->
  <line x1="900" y1="420" x2="940" y2="420" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="905" y="412" font-size="9" fill="#991b1b">throws</text>
</svg>
